<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="x-apple-disable-message-reformatting">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{.Subject}}</title>
<style>
  :root { color-scheme: light; supported-color-schemes: light; }
  body { margin: 0 !important; padding: 0 !important; width: 100% !important; }
  table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
  img { border: 0; line-height: 100%; outline: none; text-decoration: none; }
  @media only screen and (max-width: 620px) {
    .wrap { width: 100% !important; }
    .px { padding-left: 24px !important; padding-right: 24px !important; }
    .h1 { font-size: 30px !important; line-height: 36px !important; }
    .kv-key { width: 84px !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background-color:#E9E4DB;">
<!-- Preview text shown next to the subject in the inbox. The filler keeps body text out of it. -->
<div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">{{.Preheader}}&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#E9E4DB;">
  <tr>
    <td align="center" style="padding:32px 12px 40px;">

      <table role="presentation" class="wrap" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;background-color:#F3F0EA;border:1px solid #DDD6CA;">

        <!-- Wordmark -->
        <tr>
          <td class="px" style="padding:26px 48px 22px;border-bottom:1px solid #DDD6CA;">
            <a href="{{.SiteURL}}" style="text-decoration:none;color:#17150F;"><span style="font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;font-size:21px;line-height:24px;letter-spacing:5px;color:#17150F;">DADO</span><span style="font-family:Arial,sans-serif;font-size:9px;line-height:24px;color:#C05A34;padding:0 9px 0 5px;vertical-align:middle;">&#9679;</span><span style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:9px;line-height:24px;letter-spacing:3px;text-transform:uppercase;color:#6B645B;">Post&nbsp;Production</span></a>
          </td>
        </tr>

{{template "content" .}}

        <!-- Footer -->
        <tr>
          <td class="px" style="padding:30px 48px 34px;background-color:#17150F;">
            <p style="margin:0 0 12px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;font-size:16px;line-height:20px;letter-spacing:4px;color:#F3F0EA;">DADO<span style="font-family:Arial,sans-serif;font-size:7px;color:#d9784f;padding-left:6px;vertical-align:middle;letter-spacing:0;">&#9679;</span></p>
            <p style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:21px;color:#B9B4AB;">Photo, video &amp; voice post-production.<br><a href="mailto:hello@dado.studio" style="color:#F3F0EA;text-decoration:none;">hello@dado.studio</a>&nbsp;&nbsp;·&nbsp;&nbsp;<a href="tel:+8801841334473" style="color:#F3F0EA;text-decoration:none;">+880&nbsp;1841&nbsp;33&nbsp;44&nbsp;73</a>&nbsp;&nbsp;·&nbsp;&nbsp;Dhaka, Bangladesh</p>
            <p style="margin:18px 0 0;padding-top:16px;border-top:1px solid #34302A;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#8F897F;">{{.Reason}}</p>
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>
</body>
</html>
